name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    env:
      # MySQL comes preinstalled on GitHub's Ubuntu runners (root password "root"); no containers used.
      LL_TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ledgerline_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Start MySQL and create the test database
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE ledgerline_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Security lint (bandit)
        run: bandit -q -c pyproject.toml -r app migrations
      - name: Known-vulnerability check on dependencies
        run: pip-audit -r requirements.txt
      - run: pytest

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Known-vulnerability check on dependencies
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
