[project]
name = "ledgerline-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]
ignore = ["E501"]  # ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["requires_db: needs a real MySQL (set LL_TEST_DATABASE_URL)"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
