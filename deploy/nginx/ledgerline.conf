# Example production server blocks (http context). Replace host names and certificate paths.
# Web app: static files from web/dist. API: reverse proxy to uvicorn on loopback.
server {
    listen 80;
    server_name app.example.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.25.1+ prefers a separate `http2 on;`; this form works on both
    server_name app.example.in;

    ssl_certificate     /etc/letsencrypt/live/app.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 1m;          # matches the API default; uploads get their own limit in chunk C16
    root /var/www/ledgerline/web;

    # API: the application sets its own security headers, so none are added here.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build files: cache for a year.
    location /assets/ {
        include /etc/nginx/ledgerline/security-headers.conf;
        expires 1y;
        try_files $uri =404;
    }

    # Entry page and service worker must never be cached, or updates would not arrive.
    location = /index.html { include /etc/nginx/ledgerline/security-headers.conf; expires -1; }
    location = /sw.js      { include /etc/nginx/ledgerline/security-headers.conf; expires -1; }

    # Everything else is the single-page app.
    location / {
        include /etc/nginx/ledgerline/security-headers.conf;
        try_files $uri /index.html;
    }
}
